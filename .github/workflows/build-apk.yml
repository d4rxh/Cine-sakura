name: Build Cine-Sakura APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Clean Release Packages
        run: |
          mkdir -p dist_apks
          cp app/build/outputs/apk/release/*.apk dist_apks/CineSakura-Release.apk
          cp app/build/outputs/apk/debug/*.apk dist_apks/CineSakura-Debug.apk
          cp app/build/outputs/apk/release/*.apk dist_apks/app-release.apk
          cp app/build/outputs/apk/debug/*.apk dist_apks/app-debug.apk
          ls -la dist_apks

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineSakura-Debug-APK
          path: dist_apks/CineSakura-Debug.apk
          retention-days: 30

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineSakura-Release-APK
          path: dist_apks/CineSakura-Release.apk
          retention-days: 30

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist_apks/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
